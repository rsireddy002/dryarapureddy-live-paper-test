name: Premarket scan

on:
  schedule:
    # Every 5 minutes from market open to close, IST -> UTC (IST = UTC+5:30).
    # Minutes offset by :02/:07/:12/:17/... instead of :00/:05/:10/... --
    # GitHub Actions schedules queued at round clock marks get delayed or
    # silently dropped under platform load far more often than off-beat
    # minutes do.
    #   09:17-09:27 IST = 03:47-03:57 UTC -- opening stretch
    #   09:32-14:57 IST = 04:02-09:57 UTC -- every 5 min, full hours
    #   15:32 IST = 10:02 UTC -- closing run
    # GitHub Actions schedules are "best effort" -- under platform load a
    # run can slip by a few minutes, so treat this as "roughly every 5
    # min" rather than to-the-second.
    - cron: "47,52,57 3 * * 1-5"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 4-9 * * 1-5"
    - cron: "2 10 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run premarket scan
        env:
          UPSTOX_ANALYTICAL_TOKEN: ${{ secrets.UPSTOX_ANALYTICAL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_premarket_scan.py

      # Only runs if any step above this point failed -- pushes a short
      # alert to the SAME Telegram chat so a silent/broken run doesn't
      # just go unnoticed. Uses curl directly (no extra dependencies)
      # since the Python script itself may not have even started.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Premarket scan FAILED (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Check the Actions log."
