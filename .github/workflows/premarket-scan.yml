name: Premarket scan

on:
  schedule:
    # 04:03 UTC = 9:33 AM IST, weekdays -- a few minutes after market open
    # so 3-6 candles exist (avoids the noisy single-candle signal), and a
    # few minutes off the exact hour to avoid GitHub Actions' :00 traffic.
    - cron: "3 4 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run premarket scan
        env:
          UPSTOX_ANALYTICAL_TOKEN: ${{ secrets.UPSTOX_ANALYTICAL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_premarket_scan.py

      # Only runs if any step above this point failed -- pushes a short
      # alert to the SAME Telegram chat so a silent/broken run doesn't
      # just go unnoticed. Uses curl directly (no extra dependencies)
      # since the Python script itself may not have even started.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Premarket scan FAILED this morning (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Check the Actions log."
