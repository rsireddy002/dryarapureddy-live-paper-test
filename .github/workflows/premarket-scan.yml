name: Premarket scan

permissions:
  contents: write

on:
  schedule:
    # Every 5 minutes, offset 2 minutes off the round clock marks, covering
    # market hours with margin: 03:00-10:59 UTC = 08:30-16:29 IST.
    # Single plain cron line (no multiple entries, no comma lists) to match
    # the exact style of scheduled-precompute.yml, which IS firing reliably
    # on schedule in this same repo.
    #
    # NOTE: this schedule trigger has proven unreliable in dryarapureddy-live
    # (zero "Scheduled" firings across two full trading days despite a clean
    # YAML file) -- the primary trigger there is now an external cron-job.org
    # job calling this workflow's workflow_dispatch endpoint directly every 5
    # minutes. Keep this schedule as a redundant fallback regardless.
    - cron: "2-59/5 3-10 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab,
                         # and is what the external cron-job.org job calls

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run premarket scan
        env:
          UPSTOX_ANALYTICAL_TOKEN: ${{ secrets.UPSTOX_ANALYTICAL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_premarket_scan.py

      # Commits the updated paper-trading book (paper_trades.json) so open
      # positions and closed-trade history persist across runs -- same
      # force-add-despite-.gitignore + commit-if-changed pattern used by
      # scheduled-precompute.yml for sahi_zones_cache.json.
      - name: Commit and push paper trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f paper_trades.json
          git diff --quiet --cached || git commit -m "Paper trades update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      # Only runs if any step above this point failed -- pushes a short
      # alert to the SAME Telegram chat so a silent/broken run doesn't
      # just go unnoticed. Uses curl directly (no extra dependencies)
      # since the Python script itself may not have even started.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Premarket scan FAILED (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Check the Actions log."
