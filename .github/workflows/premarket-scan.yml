name: Premarket scan

on:
  schedule:
    # Every 15 minutes from market open to close, IST -> UTC (IST = UTC+5:30):
    #   09:15 IST = 03:45 UTC  -- one-off first run of the day
    #   09:30-14:45 IST = 04:00-09:15 UTC -- every 15 min, full hours
    #   15:30 IST = 10:00 UTC  -- closing run
    # GitHub Actions schedules are "best effort" -- under platform load a
    # run can slip by a few minutes, so treat this as "roughly every 15
    # min" rather than to-the-second.
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run premarket scan
        env:
          UPSTOX_ANALYTICAL_TOKEN: ${{ secrets.UPSTOX_ANALYTICAL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_premarket_scan.py

      # Only runs if any step above this point failed -- pushes a short
      # alert to the SAME Telegram chat so a silent/broken run doesn't
      # just go unnoticed. Uses curl directly (no extra dependencies)
      # since the Python script itself may not have even started.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Premarket scan FAILED (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Check the Actions log."
